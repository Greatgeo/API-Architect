    <script>
      (function() {
        function isIgnoredExtensionError(err) {
          if (!err) return false;
          var str = (typeof err === 'string') ? err : (err.message || err.reason || String(err));
          return /metamask|ethereum|failed to connect/i.test(str);
        }

        // Intercept unhandled promise rejections in capture phase
        window.addEventListener('unhandledrejection', function(event) {
          if (isIgnoredExtensionError(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        // Intercept window error events in capture phase
        window.addEventListener('error', function(event) {
          if (isIgnoredExtensionError(event.message || event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        // Filter console.error from extension scripts
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var hasExtError = args.some(function(arg) {
            return isIgnoredExtensionError(arg);
          });
          if (hasExtError) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
